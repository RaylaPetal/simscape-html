<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShowSims — Live Second Life Venues</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-top">
        <a class="brand" href="./">
          <img src="assets/logo.svg" alt="" class="brand-mark">
          <span>ShowSims</span>
        </a>
        <span class="slt-clock" id="slt-clock" title="Second Life Time (Pacific)"></span>
      </div>
      <div class="header-bottom">
        <p class="tagline">Live, currently-open Second Life venues</p>
        <div class="header-actions">
          <a id="hud-btn" class="header-btn" target="_blank" rel="noopener">Get the HUD</a>
          <a id="donate-btn" class="header-btn header-btn-accent" target="_blank" rel="noopener">Donate</a>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="filters" id="theme-filters" role="group" aria-label="Filter by theme">
        <button class="filter-chip is-active" data-theme="all" type="button">All</button>
        <!-- theme chips are injected by app.js from THEMES, kept in sync with
             lsl/shared_reference/themes.md -->
      </div>
      <div class="toolbar-meta">
        <label class="sort-label" for="sort-select">Sort</label>
        <select id="sort-select" class="sort-select">
          <option value="population_desc">Population (high–low)</option>
          <option value="population_asc">Population (low–high)</option>
          <option value="name_asc">Name (A–Z)</option>
          <option value="theme_asc">Theme (A–Z)</option>
        </select>
        <span id="venue-count">Loading…</span>
        <button id="refresh-btn" class="refresh-btn" type="button" title="Refresh now">⟳</button>
      </div>
    </div>

    <p id="status-message" class="status-message" hidden></p>

    <section id="venue-grid" class="venue-grid" aria-live="polite"></section>

    <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
      <button id="page-prev" class="page-btn" type="button">← Prev</button>
      <span id="page-indicator" class="page-indicator"></span>
      <button id="page-next" class="page-btn" type="button">Next →</button>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Venues are listed for a limited time by their owners (2–24 hours) and disappear
        automatically when that time runs out.</p>
    </div>
  </footer>

  <template id="venue-card-template">
    <article class="venue-card">
      <div class="venue-photo-wrap">
        <img class="venue-photo" alt="" loading="lazy" hidden>
      </div>
      <div class="venue-card-top">
        <h2 class="venue-name"></h2>
        <span class="theme-badge"></span>
      </div>
      <div class="venue-card-bottom">
        <span class="population" title="Current population">
          <span class="population-dot" aria-hidden="true"></span>
          <span class="population-count"></span>
        </span>
        <span class="region-name"></span>
      </div>
      <a class="teleport-link" target="_blank" rel="noopener">Open SLURL ↗</a>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
