<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simscape — Live Second Life Sims</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-top">
        <a class="brand" href="./">
          <img src="assets/logo.svg" alt="" class="brand-mark">
          <span>Simscape</span>
        </a>
        <span class="slt-clock" id="slt-clock" title="Second Life Time (Pacific)"></span>
      </div>
      <div class="header-bottom">
        <p class="tagline">Live, currently-open Second Life sims</p>
        <div class="header-actions">
          <a id="hud-btn" class="header-btn" target="_blank" rel="noopener">Get the HUD</a>
          <a class="header-btn header-btn-accent" target="_blank" rel="noopener"
             href="https://my.secondlife.com/raypetal#about_tab">Donate L$</a>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="search-row">
      <input type="search" id="search-input" class="search-input"
             placeholder="Search sims by name or region…" aria-label="Search sims">
    </div>

    <div class="toolbar">
      <div class="filters" id="theme-filters" role="group" aria-label="Filter by theme">
        <button class="filter-chip is-active" data-theme="all" type="button">All</button>
        <!-- theme chips are injected by app.js from THEMES, kept in sync with
             lsl/shared_reference/themes.md -->
      </div>
      <div class="toolbar-meta">
        <label class="sort-label" for="sort-select">Sort</label>
        <select id="sort-select" class="sort-select">
          <option value="population_desc">Population (high–low)</option>
          <option value="population_asc">Population (low–high)</option>
          <option value="name_asc">Name (A–Z)</option>
          <option value="theme_asc">Theme (A–Z)</option>
        </select>
        <span id="venue-count">Loading…</span>
        <button id="refresh-btn" class="refresh-btn" type="button" title="Refresh now">⟳</button>
      </div>
    </div>

    <p id="status-message" class="status-message" hidden></p>

    <section id="venue-grid" class="venue-grid" aria-live="polite"></section>

    <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
      <button id="page-prev" class="page-btn" type="button">← Prev</button>
      <span id="page-indicator" class="page-indicator"></span>
      <button id="page-next" class="page-btn" type="button">Next →</button>
    </nav>
  </main>

  <template id="venue-card-template">
    <article class="venue-card">
      <div class="venue-photo-wrap">
        <img class="venue-photo" alt="" loading="lazy" hidden>
        <span class="maturity-badge"></span>
      </div>
      <div class="venue-card-top">
        <h2 class="venue-name"></h2>
        <div class="theme-badges"></div>
      </div>
      <div class="venue-card-bottom">
        <span class="population" title="Current population">
          <span class="population-dot" aria-hidden="true"></span>
          <span class="population-count"></span>
        </span>
        <span class="region-name"></span>
      </div>
      <div class="venue-card-actions">
        <a class="teleport-link" target="_blank" rel="noopener">Open SLURL ↗</a>
        <button class="report-link" type="button">
          <svg class="report-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Report
        </button>
      </div>
    </article>
  </template>

  <dialog id="report-dialog" class="report-dialog">
    <form id="report-form" method="dialog" class="admin-form">
      <h2>Report <span id="report-venue-name"></span></h2>
      <div id="report-fields">
        <label>Reason
          <select id="report-reason" required>
            <option value="Misleading theme/info">Misleading theme/info</option>
            <option value="Inactive/Not actually open">Inactive/Not actually open</option>
            <option value="Inappropriate content">Inappropriate content</option>
            <option value="Spam/Fake listing">Spam/Fake listing</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Details <span class="admin-optional">(optional)</span>
          <textarea id="report-details" maxlength="500" rows="3"></textarea>
        </label>
        <label>Your name <span class="admin-optional">(optional)</span>
          <input type="text" id="report-reporter-name" maxlength="64">
        </label>
      </div>
      <p id="report-error" class="admin-error" hidden></p>
      <p id="report-success" class="admin-hint" hidden>Thanks — this report has been sent to the admins.</p>
      <div id="report-actions" class="report-dialog-actions">
        <button type="button" id="report-cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="report-submit-btn" class="btn btn-accent">Submit Report</button>
      </div>
    </form>
  </dialog>

  <dialog id="venue-detail-dialog" class="venue-detail-dialog">
    <button type="button" id="vd-close-btn" class="venue-detail-close" aria-label="Close">✕</button>
    <div class="venue-detail-photo-wrap" id="vd-photo-wrap">
      <img class="venue-detail-photo" id="vd-photo" alt="" hidden>
      <span class="maturity-badge" id="vd-maturity-badge"></span>
    </div>
    <div class="venue-detail-body">
      <div class="venue-detail-top">
        <h2 id="vd-name"></h2>
        <div class="theme-badges" id="vd-themes"></div>
      </div>
      <dl class="venue-detail-list">
        <div class="venue-detail-row"><dt>Population</dt><dd id="vd-population"></dd></div>
        <div class="venue-detail-row"><dt>Region</dt><dd id="vd-region"></dd></div>
        <div class="venue-detail-row"><dt>Maturity</dt><dd id="vd-maturity"></dd></div>
        <div class="venue-detail-row"><dt>Published</dt><dd id="vd-published"></dd></div>
        <div class="venue-detail-row"><dt>Closes</dt><dd id="vd-expires"></dd></div>
      </dl>
      <a id="vd-teleport-link" class="btn btn-accent venue-detail-teleport" target="_blank" rel="noopener">Open SLURL ↗</a>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
