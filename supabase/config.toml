# Supabase local/project config for Simscape.
# LSL is not an OAuth/browser client, so these functions verify their own
# input/authorization rather than relying on Supabase's JWT gateway check.

[functions.publish]
verify_jwt = false

[functions.heartbeat]
verify_jwt = false

[functions.delist]
verify_jwt = false

# admin-add-admin is called from the (authenticated) admin board, not LSL, so it
# keeps the default JWT gate — see the comment at the top of its index.ts for why
# that alone still isn't sufficient authorization on its own.
[functions.admin-add-admin]
verify_jwt = true
